services:
  skydaddy:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/UPLOADS
      - perma:/app/PERMA
      - sessions:/app/flask_session
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      UPLOAD_FOLDER: /app/UPLOADS
      PERMA_FOLDER: /app/PERMA
      MAP_FILE: /app/UPLOADS/file_map.json
    restart: unless-stopped

volumes:
  uploads:
  perma:
  sessions:
