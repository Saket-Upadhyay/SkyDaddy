[project]
name = "skydaddy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-session>=0.8.0",
    "waitress>=3.0.2",
]

[tool.uv.scripts]
dev  = "flask --app app run --debug --port 8000"
prod = "python app.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
